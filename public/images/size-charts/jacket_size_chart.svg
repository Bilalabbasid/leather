<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="100%" height="100%">
  <defs>
    <style>
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #FFFFFF; letter-spacing: 2px; }
      .col-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #C85A17; letter-spacing: 1px; }
      .row-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #111111; }
      .cell-val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 400; fill: #333333; text-anchor: middle; }
      .grid-line { stroke: #E5E5E5; stroke-width: 1; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="700" height="320" fill="#FFFFFF" rx="6" />
  <rect width="698" height="318" x="1" y="1" fill="none" stroke="#E5E5E5" stroke-width="1" rx="6" />

  <!-- Top Black Bar Title -->
  <rect x="0" y="0" width="700" height="48" fill="#111111" rx="6" />
  <rect x="0" y="40" width="700" height="8" fill="#111111" />
  <text x="350" y="30" text-anchor="middle" class="header-title">ACEMEN ATELIER LEATHER JACKET SIZE CHART (INCHES)</text>

  <!-- Column Header Row Background -->
  <rect x="0" y="48" width="700" height="38" fill="#FBFBFB" />
  <line x1="0" y1="86" x2="700" y2="86" class="grid-line" stroke-width="1.5" />

  <!-- Column Headers -->
  <text x="75" y="72" class="row-label">MEASUREMENT</text>
  <text x="210" y="72" text-anchor="middle" class="col-header">SMALL</text>
  <text x="305" y="72" text-anchor="middle" class="col-header">MEDIUM</text>
  <text x="400" y="72" text-anchor="middle" class="col-header">LARGE</text>
  <text x="495" y="72" text-anchor="middle" class="col-header">XL</text>
  <text x="590" y="72" text-anchor="middle" class="col-header">XXL</text>

  <!-- Vertical Divider Lines -->
  <line x1="150" y1="48" x2="150" y2="310" class="grid-line" />
  <line x1="250" y1="48" x2="250" y2="310" class="grid-line" />
  <line x1="345" y1="48" x2="345" y2="310" class="grid-line" />
  <line x1="440" y1="48" x2="440" y2="310" class="grid-line" />
  <line x1="535" y1="48" x2="535" y2="310" class="grid-line" />
  <line x1="640" y1="48" x2="640" y2="310" class="grid-line" />

  <!-- Row 1: Chest -->
  <rect x="0" y="86" width="700" height="36" fill="#FFFFFF" />
  <text x="20" y="108" class="row-label">Chest Circumference</text>
  <text x="210" y="108" class="cell-val">38</text>
  <text x="305" y="108" class="cell-val">40</text>
  <text x="400" y="108" class="cell-val">42</text>
  <text x="495" y="108" class="cell-val">44</text>
  <text x="590" y="108" class="cell-val">46</text>
  <line x1="0" y1="122" x2="700" y2="122" class="grid-line" />

  <!-- Row 2: Bottom Hem -->
  <rect x="0" y="122" width="700" height="36" fill="#FAFAFA" />
  <text x="20" y="145" class="row-label">Bottom Hem Width</text>
  <text x="210" y="145" class="cell-val">37</text>
  <text x="305" y="145" class="cell-val">39</text>
  <text x="400" y="145" class="cell-val">41</text>
  <text x="495" y="145" class="cell-val">43</text>
  <text x="590" y="145" class="cell-val">45</text>
  <line x1="0" y1="158" x2="700" y2="158" class="grid-line" />

  <!-- Row 3: Shoulder -->
  <rect x="0" y="158" width="700" height="36" fill="#FFFFFF" />
  <text x="20" y="181" class="row-label">Shoulder Across</text>
  <text x="210" y="181" class="cell-val">17.5</text>
  <text x="305" y="181" class="cell-val">18.0</text>
  <text x="400" y="181" class="cell-val">18.5</text>
  <text x="495" y="181" class="cell-val">19.0</text>
  <text x="590" y="181" class="cell-val">19.5</text>
  <line x1="0" y1="194" x2="700" y2="194" class="grid-line" />

  <!-- Row 4: Front Length -->
  <rect x="0" y="194" width="700" height="36" fill="#FAFAFA" />
  <text x="20" y="217" class="row-label">Front Body Length</text>
  <text x="210" y="217" class="cell-val">25.0</text>
  <text x="305" y="217" class="cell-val">25.5</text>
  <text x="400" y="217" class="cell-val">26.0</text>
  <text x="495" y="217" class="cell-val">26.5</text>
  <text x="590" y="217" class="cell-val">27.0</text>
  <line x1="0" y1="230" x2="700" y2="230" class="grid-line" />

  <!-- Row 5: Bicep -->
  <rect x="0" y="230" width="700" height="36" fill="#FFFFFF" />
  <text x="20" y="253" class="row-label">Bicep Circumference</text>
  <text x="210" y="253" class="cell-val">15.5</text>
  <text x="305" y="253" class="cell-val">16.0</text>
  <text x="400" y="253" class="cell-val">16.5</text>
  <text x="495" y="253" class="cell-val">17.0</text>
  <text x="590" y="253" class="cell-val">17.5</text>
  <line x1="0" y1="266" x2="700" y2="266" class="grid-line" />

  <!-- Row 6: Sleeve Length -->
  <rect x="0" y="266" width="700" height="36" fill="#FAFAFA" />
  <text x="20" y="289" class="row-label">Sleeve Length</text>
  <text x="210" y="289" class="cell-val">25.0</text>
  <text x="305" y="289" class="cell-val">25.5</text>
  <text x="400" y="289" class="cell-val">26.0</text>
  <text x="495" y="289" class="cell-val">26.5</text>
  <text x="590" y="289" class="cell-val">27.0</text>
  <line x1="0" y1="302" x2="700" y2="302" class="grid-line" />
</svg>
